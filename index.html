<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار مستوى الإنجليزية</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#38bdf8;
    --accent2:#22c55e;
    --danger:#ef4444;
    --orange:#f59e0b;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --border:#334155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e293b);
    color:var(--text);
    min-height:100vh;
    padding:20px;
  }
  .wrap{max-width:680px;margin:0 auto;}
  header{text-align:center;margin-bottom:24px;}
  header h1{font-size:26px;margin-bottom:6px;}
  header p{color:var(--muted);font-size:14px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    margin-bottom:16px;
  }

  .levels-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .level-btn{
    background:#0f172a;border:1px solid var(--border);border-radius:14px;
    padding:18px 10px;text-align:center;cursor:pointer;transition:.15s;color:var(--text);
  }
  .level-btn:hover{border-color:var(--accent);transform:translateY(-2px);}
  .level-btn .lvl{font-size:22px;font-weight:700;color:var(--accent);}
  .level-btn .lvl-name{font-size:12px;color:var(--muted);margin-top:4px;}
  .level-btn .qcount{font-size:11px;color:var(--muted);margin-top:6px;}

  /* Tier badges */
  .tier-strip{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tier-chip{
    font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted);
  }
  .tier-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.1);}
  .tier-chip.done-good{border-color:var(--accent2);color:var(--accent2);background:rgba(34,197,94,.1);}
  .tier-chip.done-bad{border-color:var(--danger);color:#fca5a5;background:rgba(239,68,68,.1);}

  .progress-bar{height:6px;background:#0f172a;border-radius:10px;overflow:hidden;margin-bottom:18px;display:flex;}
  .progress-fill{height:100%;background:var(--accent);transition:width .3s;}

  .q-count{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;}
  .tier-label{font-weight:700;}
  .tier-label.t1{color:var(--accent2);}
  .tier-label.t2{color:#eab308;}
  .tier-label.t3{color:var(--orange);}
  .tier-label.t4{color:var(--danger);}

  .question{font-size:18px;margin-bottom:10px;line-height:1.5;direction:ltr;text-align:left;}
  .passage{
    font-size:14px;color:var(--muted);background:#0f172a;border:1px solid var(--border);
    border-radius:10px;padding:12px;margin-bottom:14px;direction:ltr;text-align:left;line-height:1.6;
  }

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    background:#0f172a;border:1px solid var(--border);border-radius:10px;padding:13px 14px;
    cursor:pointer;font-size:15px;direction:ltr;text-align:left;transition:.15s;color:var(--text);
  }
  .opt:hover{border-color:var(--accent);}
  .opt.selected{border-color:var(--accent);background:rgba(56,189,248,.12);}
  .opt.correct{border-color:var(--accent2);background:rgba(34,197,94,.15);}
  .opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);}
  .opt.disabled{pointer-events:none;}

  .nav-row{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}
  button.primary{
    background:var(--accent);color:#0f172a;border:none;padding:12px 22px;border-radius:10px;
    font-weight:700;cursor:pointer;font-size:15px;
  }
  button.primary:disabled{opacity:.4;cursor:not-allowed;}
  button.secondary{
    background:transparent;border:1px solid var(--border);color:var(--text);padding:12px 18px;
    border-radius:10px;cursor:pointer;font-size:14px;
  }

  .result-score{font-size:48px;font-weight:800;text-align:center;color:var(--accent);margin:10px 0;}
  .result-label{text-align:center;font-size:16px;color:var(--muted);margin-bottom:18px;}
  .result-verdict{text-align:center;padding:14px;border-radius:12px;font-size:15px;margin-bottom:18px;}
  .verdict-pass{background:rgba(34,197,94,.15);color:var(--accent2);border:1px solid rgba(34,197,94,.4);}
  .verdict-fail{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.4);}
  .verdict-ceiling{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.4);}

  .tier-breakdown{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .tier-row{
    display:flex;justify-content:space-between;align-items:center;background:#0f172a;
    border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;
  }
  .tier-row .pct{font-weight:700;}

  .review-item{border-bottom:1px solid var(--border);padding:12px 0;direction:ltr;text-align:left;font-size:14px;}
  .review-item:last-child{border-bottom:none;}
  .review-q{margin-bottom:6px;color:var(--text);}
  .review-your{color:var(--danger);}
  .review-correct{color:var(--accent2);}

  .hidden{display:none;}
  .back-link{color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:10px;display:inline-block;}
  .back-link:hover{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>

</div>

/* ============ STATE ============ */
let currentLevel = null;
let currentTier = 0;
let currentIndexInTier = 0;
let flatItems = []; // {tierIdx, item}
let currentIndex = 0;
let selectedAnswer = null;
let userAnswers = []; // {tierIdx, chosen, correct, isCorrect}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Returns a copy of the item with its options shuffled and the correct index remapped
function shuffleItemOptions(item){
  const optWithFlag = item.opts.map((opt,i)=>({opt, isCorrect:i===item.a}));
  const shuffled = shuffleArray(optWithFlag);
  return {
    q: item.q,
    passage: item.passage,
    opts: shuffled.map(o=>o.opt),
    a: shuffled.findIndex(o=>o.isCorrect)
  };
}

function flatten(level){
  const tiers = QUESTIONS[level].tiers;
  const flat = [];
  tiers.forEach((tier, tIdx)=>{
    const poolSize = tier.items.length;
    const drawSize = tier.size ? Math.min(tier.size, poolSize) : poolSize;
    // pick a random subset (different combination on each retry if pool > drawSize)
    const chosen = shuffleArray(tier.items).slice(0, drawSize);
    // shuffle order and randomize each question's option positions
    chosen.forEach(item=>{
      flat.push({tierIdx: tIdx, item: shuffleItemOptions(item)});
    });
  });
  return flat;
}

/* ============ RENDER LEVEL GRID ============ */
function buildLevelsGrid(){
  const grid = document.getElementById('levelsGrid');
  grid.innerHTML = '';
  Object.keys(QUESTIONS).forEach(lvl=>{
    const data = QUESTIONS[lvl];
    const totalQ = data.tiers.reduce((s,t)=>s+t.items.length,0);
    const div = document.createElement('div');
    div.className = 'level-btn';
    div.onclick = () => startLevel(lvl);
    div.innerHTML = `
      <div class="lvl">${lvl}</div>
      <div class="lvl-name">${data.name}</div>
      <div class="qcount">${totalQ} سؤال متدرج</div>
    `;
    grid.appendChild(div);
  });
}

/* ============ NAVIGATION ============ */
function goHome(){
  document.getElementById('screen-select').classList.remove('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  currentLevel = null;
}

function startLevel(lvl){
  currentLevel = lvl;
  flatItems = flatten(lvl);
  currentIndex = 0;
  userAnswers = [];
  document.getElementById('screen-select').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderTierStrip();
  renderQuestion();
}

function retryLevel(){ startLevel(currentLevel); }

function renderTierStrip(){
  const strip = document.getElementById('tierStrip');
  strip.innerHTML = '';
  TIER_META.forEach((tm, idx)=>{
    if(!QUESTIONS[currentLevel].tiers[idx]) return;
    const chip = document.createElement('span');
    chip.className = 'tier-chip';
    chip.id = 'chip-'+idx;
    chip.textContent = tm.label;
    strip.appendChild(chip);
  });
}

function updateTierStripState(){
  const curTierIdx = flatItems[currentIndex].tierIdx;
  TIER_META.forEach((tm, idx)=>{
    const chip = document.getElementById('chip-'+idx);
    if(!chip) return;
    chip.classList.remove('active','done-good','done-bad');
    if(idx < curTierIdx){
      const tierAnswers = userAnswers.filter(a=>a.tierIdx===idx);
      const correctCount = tierAnswers.filter(a=>a.isCorrect).length;
      const pct = tierAnswers.length ? correctCount/tierAnswers.length : 0;
      chip.classList.add(pct >= 0.6 ? 'done-good' : 'done-bad');
    } else if(idx === curTierIdx){
      chip.classList.add('active');
    }
  });
}

function renderQuestion(){
  const total = flatItems.length;
  const {tierIdx, item} = flatItems[currentIndex];
  selectedAnswer = null;

  updateTierStripState();

  document.getElementById('qCount').textContent = `المستوى ${currentLevel} — سؤال ${currentIndex+1} من ${total}`;
  const tm = TIER_META[tierIdx];
  const tierLabelEl = document.getElementById('tierLabel');
  tierLabelEl.textContent = tm.label;
  tierLabelEl.className = 'tier-label ' + tm.cls;

  // progress bar segmented by tier
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = `${(currentIndex/total)*100}%`;
  bar.appendChild(fill);

  const passageBox = document.getElementById('passageBox');
  if(item.passage){
    passageBox.textContent = item.passage;
    passageBox.classList.remove('hidden');
  } else {
    passageBox.classList.add('hidden');
  }

  document.getElementById('questionText').textContent = item.q;

  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  item.opts.forEach((opt, i)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.textContent = opt;
    div.onclick = () => selectOption(i, tierIdx, item);
    list.appendChild(div);
  });

  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = (currentIndex === total-1) ? 'إنهاء الاختبار' : 'التالي';
}

function selectOption(i, tierIdx, item){
  if(selectedAnswer !== null) return;
  selectedAnswer = i;
  const opts = document.querySelectorAll('#optionsList .opt');
  opts.forEach((o, idx)=>{
    o.classList.add('disabled');
    if(idx === item.a) o.classList.add('correct');
    else if(idx === i) o.classList.add('wrong');
  });
  userAnswers.push({tierIdx, chosen:i, correct:item.a, isCorrect: i===item.a, q:item.q, opts:item.opts});
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  if(currentIndex < flatItems.length-1){
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults(){
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  const total = userAnswers.length;
  const correct = userAnswers.filter(a=>a.isCorrect).length;
  const pct = Math.round((correct/total)*100);

  document.getElementById('scoreText').textContent = `${pct}%`;
  document.getElementById('scoreLabel').textContent = `${correct} إجابة صحيحة من ${total} — مستوى ${currentLevel}`;

  // tier breakdown
  const numTiers = QUESTIONS[currentLevel].tiers.length;
  const breakdown = document.getElementById('tierBreakdown');
  breakdown.innerHTML = '';
  let ceilingTier = null;
  for(let t=0; t<numTiers; t++){
    const tAnswers = userAnswers.filter(a=>a.tierIdx===t);
    if(tAnswers.length===0) continue;
    const tCorrect = tAnswers.filter(a=>a.isCorrect).length;
    const tPct = Math.round((tCorrect/tAnswers.length)*100);
    if(tPct < 60 && ceilingTier===null) ceilingTier = t;
    const row = document.createElement('div');
    row.className = 'tier-row';
    const color = tPct>=60 ? 'var(--accent2)' : 'var(--danger)';
    row.innerHTML = `<span>${TIER_META[t].label}</span><span class="pct" style="color:${color}">${tCorrect}/${tAnswers.length} (${tPct}%)</span>`;
    breakdown.appendChild(row);
  }

  const verdictBox = document.getElementById('verdictBox');
  if(pct >= 70 && ceilingTier===null){
    verdictBox.className = 'result-verdict verdict-pass';
    verdictBox.textContent = `🎉 ممتاز! أنت متمكن تمامًا من مستوى ${currentLevel} في كل الدرجات — جاهز للانتقال للمستوى التالي`;
  } else if(ceilingTier !== null && ceilingTier > 0){
    verdictBox.className = 'result-verdict verdict-ceiling';
    verdictBox.textContent = `📍 سقفك الحالي هو "${TIER_META[ceilingTier-1] ? TIER_META[ceilingTier-1].label : TIER_META[0].label}" داخل مستوى ${currentLevel}. ذاكر درجة "${TIER_META[ceilingTier].label}" أكتر قبل ما تنتقل`;
  } else {
    verdictBox.className = 'result-verdict verdict-fail';
    verdictBox.textContent = `😕 لسه محتاج تذاكر أساسيات مستوى ${currentLevel} من البداية`;
  }

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '<h3 style="margin-top:10px;">مراجعة الإجابات:</h3>';
  userAnswers.forEach((ans, i)=>{
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `
      <div class="review-q">${i+1}. [${TIER_META[ans.tierIdx].label}] ${ans.q}</div>
      ${ans.isCorrect
        ? `<div class="review-correct">✔ ${ans.opts[ans.correct]}</div>`
        : `<div class="review-your">✘ إجابتك: ${ans.opts[ans.chosen]}</div><div class="review-correct">✔ الصحيحة: ${ans.opts[ans.correct]}</div>`
      }
    `;
    reviewList.appendChild(div);
  });
}

buildLevelsGrid();
</script>
